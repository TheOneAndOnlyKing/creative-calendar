<!DOCTYPE html>
<!-- bigfarm scenario sandbox — v2 (noon-to-noon bars; info pane for locked base events; drag-and-drop event hotbar) -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bigfarm Scenario Sandbox</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%233E6B35'/><text x='32' y='43' font-family='Georgia,serif' font-size='30' font-weight='700' fill='%23F7F4EA' text-anchor='middle'>BE</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --f-sans: 'Instrument Sans', system-ui, sans-serif;
    --f-serif: 'Fraunces', Georgia, serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  body[data-font="sans"]  { --ui: var(--f-sans); }
  body[data-font="serif"] { --ui: var(--f-serif); }
  body[data-font="mono"]  { --ui: var(--f-mono); }
  body[data-theme="light"] {
    --bg:#F2F0E8; --card:#FBFAF5; --ink:#22251E; --muted:#6C6F63;
    --line:#E3E0D4; --line2:#D2CEBF; --dayline:rgba(34,37,30,.08);
    --accent:#3E6B35; --on-accent:#F6F4EB; --accent-soft:rgba(62,107,53,.09);
    --wknd:rgba(62,80,50,.065); --warn:#A66A21;
    --shadow:0 1px 2px rgba(30,30,20,.05), 0 10px 30px rgba(30,30,20,.06);
    --tipbg:#22251E; --tipink:#F2F0E8;
    --bar-0:#C25B3C; --bar-1:#6D8A56; --bar-2:#D19E3A; --bar-3:#5B7BA6;
    --bar-4:#9A6E9C; --bar-5:#42968B; --bar-6:#B06675; --bar-7:#7A7233;
  }
  body[data-theme="grey"] {
    --bg:#C8C8C1; --card:#D4D4CC; --ink:#26261F; --muted:#5E5E55;
    --line:#B8B8AE; --line2:#A6A69A; --dayline:rgba(38,38,31,.09);
    --accent:#37552E; --on-accent:#EDEBE0; --accent-soft:rgba(55,85,46,.12);
    --wknd:rgba(30,35,25,.07); --warn:#8A5A1C;
    --shadow:0 1px 2px rgba(30,30,20,.08), 0 10px 30px rgba(30,30,20,.1);
    --tipbg:#26261F; --tipink:#D4D4CC;
    --bar-0:#A34A2E; --bar-1:#546F3F; --bar-2:#A87E2A; --bar-3:#425F8A;
    --bar-4:#7B5680; --bar-5:#2B7A6E; --bar-6:#8C4A59; --bar-7:#5F5A28;
  }
  body[data-theme="dark"] {
    color-scheme: dark;
    --bg:#141711; --card:#1B1E17; --ink:#EAE9DF; --muted:#9AA092;
    --line:#2A2D22; --line2:#3A3E2C; --dayline:rgba(234,233,223,.06);
    --accent:#9CCB7E; --on-accent:#141B0C; --accent-soft:rgba(156,203,126,.12);
    --wknd:rgba(255,255,255,.035); --warn:#D9A253;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px rgba(0,0,0,.35);
    --tipbg:#EAE9DF; --tipink:#1B1E17;
    --bar-0:#E07850; --bar-1:#93BE74; --bar-2:#E5BC58; --bar-3:#8FA9DA;
    --bar-4:#C293C6; --bar-5:#5FC2B0; --bar-6:#DE8E9C; --bar-7:#B2B45E;
  }
  html { background: var(--bg); }
  body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 14px; -webkit-font-smoothing: antialiased; transition: background-color .25s, color .25s; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--accent); color: var(--on-accent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 6px; border: 2px solid var(--card); }
  ::-webkit-scrollbar-track { background: transparent; }
  * { scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 11px 22px; border-bottom: 1px solid var(--line); }
  .home-wrap { display: flex; align-items: center; gap: 12px; min-height: 34px; }
  .home { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; min-height: 34px; }
  .homelogo { display: block; height: 32px; width: auto; max-width: 260px; object-fit: contain; }
  .homefall { font-family: var(--f-serif); font-size: 17px; font-weight: 600; }
  .bt { font-family: var(--f-serif); font-size: 17px; font-weight: 600; }
  .themebtn { display: flex; align-items: center; gap: 8px; padding: 7px 13px; border: 1px solid var(--line); border-radius: 10px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .themebtn:hover { color: var(--ink); border-color: var(--line2); }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 22px 44px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }

  .toolbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .tb-side { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tb-side.r { justify-content: flex-end; }
  .tb-center { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tb-mid { display: flex; align-items: center; gap: 8px; }
  #calCenter { width: 220px; justify-content: center; }
  .ghostbtn { padding: 6px 12px; border: 1px solid var(--line); border-radius: 9px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .ghostbtn:hover { color: var(--ink); border-color: var(--line2); }
  .ghostbtn.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { padding: 5px 12px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: var(--on-accent); }
  .nav-arrow { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); }
  .nav-arrow:hover { color: var(--ink); border-color: var(--line2); }
  .nav-label { height: 30px; padding: 0 12px; display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 9px; font-size: 13px; font-weight: 600; }
  .nav-label:hover { border-color: var(--accent); color: var(--accent); }
  .nav-label svg { opacity: .5; }
  .view-count { font-size: 12px; color: var(--muted); }

  /* the drag-and-drop hotbar */
  .hotbar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .hotbar .hb-lab { flex: none; font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; font-size: 11.5px; font-weight: 600; color: var(--ink); background: var(--bg); border: 1px solid var(--line); cursor: grab; user-select: none; -webkit-user-select: none; white-space: nowrap; }
  .chip:hover { border-color: var(--accent); }
  .chip:active { cursor: grabbing; }
  .chip .cdot { flex: none; width: 8px; height: 8px; border-radius: 50%; }
  .chip .cnt { font-family: var(--f-mono); font-size: 9px; color: var(--muted); }
  .chip img.evico { width: 12px; height: 12px; }

  .pane.active { display: block; }
  .tl-wrap { position: relative; }
  .tl { position: relative; overflow: auto; height: clamp(340px, calc(100vh - 340px), 1000px); }
  .tl-inner { position: relative; }
  .tl-head { position: sticky; top: 0; z-index: 6; display: flex; background: var(--card); border-bottom: 1px solid var(--line); }
  .tl-corner { position: sticky; left: 0; z-index: 7; flex: none; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; background: var(--card); border-right: 1px solid var(--line); font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  .sectri { display: grid; place-items: center; width: 20px; height: 14px; border-radius: 5px; color: var(--muted); }
  .sectri:hover { color: var(--ink); background: var(--accent-soft); }
  .sectri svg { transition: transform .15s; }
  .sectri.open svg { transform: rotate(180deg); }
  .tl-headcol { position: relative; flex: none; overflow: hidden; }
  .hm-row { position: relative; height: 32px; }
  .hd-row { position: relative; height: 34px; }
  .hmonth { position: absolute; top: 0; height: 100%; display: flex; align-items: center; padding-left: 8px; border-left: 1px solid var(--line); font-size: 11.5px; font-weight: 600; letter-spacing: .04em; overflow: hidden; white-space: nowrap; }
  .hday { position: absolute; top: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
  .hday i { font-style: normal; font-size: 8.5px; color: var(--muted); }
  .hday i.mo { color: var(--ink); font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
  .hday b { font-size: 11px; font-weight: 500; }
  .hday.we b, .hday.we i { color: var(--muted); }
  .hday.we { background: var(--wknd); }
  .hflag { position: absolute; top: 4px; transform: translateX(-50%); z-index: 2; background: var(--accent); color: var(--on-accent); font-family: var(--f-mono); font-size: 8.5px; letter-spacing: .1em; padding: 1px 6px; border-radius: 99px; }
  .tl-lanewrap { position: relative; }
  .tl-grid { position: absolute; top: 0; bottom: 0; pointer-events: none; z-index: 0; }
  .gmonth { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .gwkd { position: absolute; top: 0; bottom: 0; background: var(--wknd); }
  .gtoday { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); }
  .lane { display: flex; position: relative; z-index: 1; border-bottom: 1px solid var(--dayline); }
  .lane:last-child { border-bottom: none; }
  .lane-label { position: sticky; left: 0; z-index: 3; flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; background: var(--card); border-right: 1px solid var(--line); }
  .lane-label .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; }
  .ltxt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .ltxt b { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lcount { margin-left: auto; flex: none; font-family: var(--f-mono); font-size: 10px; color: var(--muted); }
  .lane-chart { position: relative; flex: none; overflow: hidden; touch-action: none; }
  .lane-chart.droptgt { box-shadow: inset 0 0 0 2px var(--accent-soft), inset 0 0 0 100vmax rgba(62,107,53,.05); }
  .bar { position: absolute; border-radius: 6px; overflow: visible; display: flex; align-items: center; padding: 0 8px; cursor: grab; font-size: 10.5px; font-weight: 500; letter-spacing: .01em; transition: box-shadow .15s, filter .15s; touch-action: none; }
  .bar:hover { filter: brightness(1.06) saturate(1.05); box-shadow: 0 0 0 1.5px var(--card), 0 0 0 3px var(--accent); }
  .bar .bl { pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blo { position: absolute; display: flex; align-items: center; font-size: 10px; font-weight: 500; color: var(--ink); opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; z-index: 2; }
  .blo.dim { opacity: .3; }
  .tl.fl-on .bar:not(.is-fl) { opacity: .28; }
  .tl.fl-on .bar.base:not(.is-fl) { opacity: .17; }
  .flb { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); font-style: normal; font-family: var(--f-mono); font-size: 8px; font-weight: 700; letter-spacing: .08em; background: var(--accent); color: var(--on-accent); border-radius: 3px; padding: 1px 3px; pointer-events: none; }
  .bar.base { opacity: .6; filter: saturate(.75); cursor: pointer; }
  .bar.base:hover { box-shadow: 0 0 0 1.5px var(--card), 0 0 0 3px var(--accent); filter: saturate(.75); }
  .bar.sel { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--accent) !important; }
  .bar .hnd { position: absolute; top: 0; bottom: 0; width: 9px; cursor: ew-resize; z-index: 3; opacity: 0; transition: opacity .12s; }
  .bar .hnd.hL { left: 0; } .bar .hnd.hR { right: 0; }
  .bar .hnd::after { content: ""; position: absolute; top: 22%; bottom: 22%; width: 3px; border-radius: 2px; background: rgba(0,0,0,.35); left: 2px; }
  .bar .hnd.hR::after { left: auto; right: 2px; }
  .bar:hover .hnd { opacity: 1; }
  .bar.base .hnd { display: none; }
  .ghost { position: absolute; border-radius: 6px; background: var(--accent); opacity: .35; pointer-events: none; z-index: 2; }
  body.dragging, body.dragging * { user-select: none !important; -webkit-user-select: none !important; cursor: grabbing !important; }
  .tl-empty { position: absolute; top: 0; right: 0; bottom: 0; left: 172px; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); font-family: var(--f-serif); font-style: italic; font-size: 1.05rem; pointer-events: none; }
  .tl-empty[hidden] { display: none; }
  .tl-empty p { text-align: center; padding: 8px 16px; margin: 0 20px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }

  .vresize { display: flex; align-items: center; justify-content: center; height: 18px; cursor: row-resize; border-top: 1px solid var(--line); touch-action: none; user-select: none; -webkit-user-select: none; }
  .vresize span { width: 48px; height: 5px; border-radius: 3px; background: #3E7FC1; transition: background .15s, width .15s; }
  .vresize:hover span, .vresize.drag span { background: #2A5E97; width: 62px; }

  .cardfoot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--line); }
  .mini { padding: 6px 13px; border: 1px solid var(--line); border-radius: 9px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .mini:hover { color: var(--accent); border-color: var(--accent); }
  .mini.warn:hover { color: var(--warn); border-color: var(--warn); }
  .mini2 { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
  .mini2:hover { color: var(--accent); background: var(--accent-soft); }
  .zoomstep { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-left: auto; }
  .zoomstep button { width: 30px; height: 29px; display: grid; place-items: center; color: var(--muted); }
  .zoomstep button:hover { color: var(--ink); background: var(--accent-soft); }
  .zoomstep span { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); display: flex; align-items: center; justify-content: center; min-width: 38px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  .zoom { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .zoom button { padding: 6px 12px; font-size: 12px; font-weight: 700; letter-spacing: .03em; color: var(--muted); }
  .zoom button + button { border-left: 1px solid var(--line); }
  .zoom button.on { background: var(--accent); color: var(--on-accent); }
  .dstat { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); flex-basis: 100%; }
  .dstat.warn { color: var(--warn); }

  .notice { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 9px 18px; background: var(--accent-soft); border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .notice b { color: var(--ink); }

  .pop { position: fixed; z-index: 60; display: none; background: var(--card); border: 1px solid var(--line2); border-radius: 12px; box-shadow: 0 8px 30px rgba(20,22,14,.22); padding: 10px; }
  .pgrid { display: grid; grid-template-columns: repeat(3, 62px); gap: 4px; }
  .pgrid.y { grid-template-columns: repeat(4, 56px); }
  .pm { padding: 7px 4px; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; }
  .pm:hover { background: var(--accent-soft); color: var(--ink); }
  .pm.on { background: var(--accent); color: var(--on-accent); }
  .poptitle { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 2px 2px 8px; }
  .pseclist { display: flex; flex-direction: column; min-width: 210px; max-height: 62vh; overflow: auto; }
  .prow { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 7px; cursor: pointer; }
  .prow:hover { background: var(--accent-soft); }
  .prow .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; }
  .prow .psec { flex: 1; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow input { appearance: none; width: 15px; height: 15px; flex: none; border: 1.5px solid var(--muted); border-radius: 4px; display: grid; place-items: center; cursor: pointer; }
  .prow input:checked { background: var(--accent); border-color: var(--accent); }
  .prow input:checked::after { content: ""; width: 8px; height: 4px; border-left: 2px solid var(--on-accent); border-bottom: 2px solid var(--on-accent); transform: rotate(-45deg) translate(0, -1px); }
  .swrow { display: flex; flex-wrap: wrap; gap: 6px; }
  .swb { width: 26px; height: 26px; border-radius: 8px; border: 1.5px solid transparent; }
  .swb:hover { border-color: var(--ink); }
  .swb.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--tipbg), 0 0 0 3.5px var(--accent); }
  .evico { width: 13px; height: 13px; object-fit: contain; flex: none; pointer-events: none; }
  .bl .evico, .blo .evico { margin-right: 4px; vertical-align: -2px; }

  /* editor / info pane */
  .ed-wrap { position: fixed; z-index: 95; display: none; }
  .ed { background: var(--tipbg); color: var(--tipink); border-left: 3px solid; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 9px; width: 280px; max-height: min(80vh, 620px); overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,.3); font-size: 12px; }
  body:not([data-theme="dark"]) .ed { color-scheme: dark; }
  body[data-theme="dark"] .ed { color-scheme: light; }
  .ed label { display: flex; flex-direction: column; gap: 4px; font-family: var(--f-mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
  .ed input[type=text], .ed input[type=date], .ed select { font: inherit; font-size: 12.5px; color: var(--tipink); background: rgba(128,128,128,.15); border: 1px solid rgba(128,128,128,.45); border-radius: 7px; padding: 5px 8px; width: 100%; }
  .ed input:focus, .ed select:focus { outline: none; border-color: var(--accent); }
  .ed .edrow { display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; }
  .ed .edrow input { accent-color: var(--accent); width: 14px; height: 14px; }
  .ed .eddates { display: flex; align-items: flex-end; gap: 8px; }
  .ed .eddates label { flex: 1; }
  .ed .edacts { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .ed .edbtn { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--tipink); opacity: .8; border: 1px solid rgba(128,128,128,.5); border-radius: 6px; padding: 4px 10px; background: none; cursor: pointer; }
  .ed .edbtn:hover { opacity: 1; border-color: var(--tipink); }
  .ed #edDel:hover { color: #E07850; border-color: #E07850; opacity: 1; }
  .ed .eddays { font-family: var(--f-mono); font-size: 10px; opacity: .7; }
  .ed .custom-row { display: flex; align-items: center; gap: 10px; }
  .ed input[type="color"] { width: 34px; height: 26px; padding: 0; border: 1px solid rgba(128,128,128,.5); border-radius: 7px; background: none; cursor: pointer; }
  .ed .lbl { font-size: 12px; opacity: .8; }
  /* read-only info (locked base events) */
  .ed .iname { font-weight: 600; font-size: 13.5px; }
  .ed .ir { font-size: 12px; opacity: .85; }
  .ed .ir.mono { font-family: var(--f-mono); font-size: 10.5px; opacity: .8; }
  .ed .ir.dim { opacity: .55; font-size: 11px; }
  .ed .ifl { align-self: flex-start; font-family: var(--f-mono); font-size: 9px; font-weight: 700; letter-spacing: .1em; background: rgba(140,140,140,.3); border-radius: 3px; padding: 1px 4px; }
  .ed .tlinks { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; padding-top: 6px; border-top: 1px solid rgba(140,140,140,.4); }
  .ed a.tlink { display: flex; align-items: flex-start; gap: 8px; color: inherit; text-decoration: none; padding: 3px 6px; margin: 0 -6px; border-radius: 6px; font-size: 12px; line-height: 1.4; }
  .ed a.tlink:hover { background: rgba(140,140,140,.22); }

<script>
(function () {

  /* ── helpers ── */
  var M_L = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var M_S = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var WD  = ['S','M','T','W','T','F','S'];
  function $(s) { return document.querySelector(s); }

  function fmtRange(ev) {

  }
  function textColorFor(hex) {

    document.body.appendChild(a); a.click(); document.body.removeChild(a);

  }

  /* ── section maps / colours ── */
  var EV_SEC = new Map(), SEC_INDEX = new Map();
  SECTION_ORDER.forEach(function (s, si) {

  });
  var palCache = { theme: null, vals: [] };
  function palette() {

  }

  /* ── optional event links (eventlinks.json — same format as the main calendar) ── */

  }

  var state = {
    theme: 'dark', zoom: 1, scale: 1,
    anchor: { y: now0.getFullYear(), m: now0.getMonth() },
    mode: 'sections', showFL: false, lockPast: true, vHeight: null, hiddenSecs: []
  };
  var events = [];
  var nextId = 1, selId = null, drag = null, dataLoaded = false;
  var tl = $('#tl'), edWrap = $('#edWrap'), hotbarEl = $('#hotbar');
  var bufStartT = 0, bufEndT = 0, dayW = 20, savedScroll = 0, lastW = 0;
  var scrollRaf = 0, roTimer = 0, saveTimer = 0, statTimer = 0;

  function byId(id) { return events.find(function (x) { return x.id === id; }); }
  function canEdit(ev) { return !!ev && (ev.scenario || !state.lockPast); }
  function markEdited(ev) { if (!ev.scenario) ev.scenario = true; }
  function selEv() { return selId == null ? null : byId(selId); }

  function setStat(msg, warn) {
    var el = $('#scStatus');
    el.textContent = msg || '';
    el.classList.toggle('warn', !!warn);
    clearTimeout(statTimer);
    statTimer = setTimeout(function () { el.textContent = ''; }, 4000);
  }

  /* ── persistence ── */
  function toStorable(ev) {
    var o = { start: isoOf(ev.start), end: isoOf(ev.end), event: ev.name, section: ev.section };
    if (ev.fl) o.fl = true;
    if (ev.color) o.color = ev.color;
    o.rw = { s: ev.rw.sections, c: ev.rw.creative };
    return o;
  }
  function saveAll() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify({
          theme: state.theme, zoom: state.zoom, scale: state.scale,
          mode: state.mode, showFL: state.showFL, lockPast: state.lockPast,
          vHeight: state.vHeight, hiddenSecs: state.hiddenSecs,
          events: events.filter(function (e) { return e.scenario; }).map(toStorable)

      } catch (e) {}
    }, 300);
  }
  function sanitizeScenario(o) {
    if (!o || typeof o !== 'object') return null;
    var st = parseISO(o.start), en = parseISO(o.end);
    if (st == null || en == null || en < st) return null;
    var name = typeof o.event === 'string' && o.event.trim() ? o.event.trim() : 'Imported event';
    var sec = typeof o.section === 'string' && o.section.trim() ? o.section.trim() : 'Unsorted';
    var col = (typeof o.color === 'string' && /^#[0-9a-fA-F]{6}$/.test(o.color)) ? o.color : null;
    var rw = o.rw && typeof o.rw === 'object'
      ? { sections: (Number.isInteger(o.rw.s) && o.rw.s >= 0) ? o.rw.s : null,
          creative: (Number.isInteger(o.rw.c) && o.rw.c >= 0) ? o.rw.c : null }

  }
  function loadScenario() {
    try {
      var s = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
      if (s.theme === 'light' || s.theme === 'grey' || s.theme === 'dark') state.theme = s.theme;
      if ([7,1,3,6,12].includes(s.zoom)) state.zoom = s.zoom;
      if (typeof s.scale === 'number') state.scale = Math.min(3, Math.max(0.4, s.scale));
      if (s.mode === 'sections' || s.mode === 'creative') state.mode = s.mode;
      if (typeof s.showFL === 'boolean') state.showFL = s.showFL;
      if (typeof s.lockPast === 'boolean') state.lockPast = s.lockPast;
      if (Number.isFinite(s.vHeight) && s.vHeight > 0) state.vHeight = s.vHeight;
      if (Array.isArray(s.hiddenSecs)) state.hiddenSecs = s.hiddenSecs.filter(function (x) { return typeof x === 'string'; });

  function mkEvent(name, start, end, section, fl, color, rw, scenario) {

  }

  /* ── base data (read-only backdrop from the repo) ── */
  function parseBase(text) {
    var list = [];

  }

  /* ── sections / grouping / rows ── */
  function sectionNames() {

    var list = [...set].filter(function (r) { return r != null; }).sort(function (a, b) { return a - b; });

  }
  function overlaps(a, b) { return a.start < b.end && b.start < a.end; }
  function freeRowFrom(group, ev, from) {

  function ensureRows() {
    var k = state.mode;

      });

  var iconCache = new Map(), iconRerenderTimer = 0;

  function scheduleRerender() {
    clearTimeout(iconRerenderTimer);
    iconRerenderTimer = setTimeout(function () { buildHotbar(true); renderTimeline(); }, 80);
  }

  /* ── hotbar (drag chips onto the calendar) ── */
  var hotbarSig = null;
  function buildHotbar(force) {
    var counts = {}, order = [];
    events.forEach(function (e) {
      if (e.scenario) return;
      if (!(e.name in counts)) { counts[e.name] = 0; order.push(e.name); }
      counts[e.name]++;
    });
    var extra = [];
    events.forEach(function (e) {
      if (!e.scenario) return;
      if ((e.name in counts) || extra.indexOf(e.name) >= 0) return;
      extra.push(e.name);
    });
    /* chips grouped by section in canonical order (Weekly, Monthly, …),
       unknown sections last; within a section, by occurrence count */
    var secOf = {};
    SECTION_ORDER.forEach(function (s) { s.events.forEach(function (n) { secOf[n] = s.name; }); });
    events.forEach(function (e) { if (!(e.name in secOf)) secOf[e.name] = e.section; });
    var secRank = {};
    SECTION_ORDER.forEach(function (s, i) { secRank[s.name] = i; });
    var names = order.concat(extra).sort(function (a, b) {
      var ra = secRank[secOf[a]] != null ? secRank[secOf[a]] : SECTION_ORDER.length;
      var rb = secRank[secOf[b]] != null ? secRank[secOf[b]] : SECTION_ORDER.length;
      return ra - rb || counts[b] - counts[a] || a.localeCompare(b);
    });
    var sig = names.join('|');
    if (!force && sig === hotbarSig) return;
    hotbarSig = sig;
    var html = '<span class="hb-lab">drag to add</span>';
    names.forEach(function (nm) {
      var rec = EV_SEC.get(nm);
      var any = events.find(function (e) { return e.name === nm; });
      var sec = rec ? rec.sec : (any ? any.section : 'Unsorted');
      var cnt = counts[nm] || 0;
      html += '<span class="chip" draggable="true" data-name="' + esc(nm) + '" data-sec="' + esc(sec) +
        '" title="' + esc(nm) + ' — drop on the calendar (' + DEFAULT_LEN + ' days)">' +
        iconHTML(nm) + '<span class="cdot" style="background:' + autoColor(nm) + '"></span>' + esc(nm) +
        (cnt ? '<span class="cnt">' + cnt + '</span>' : '') + '</span>';
    });
    hotbarEl.innerHTML = html;
  }
  hotbarEl.addEventListener('dragstart', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) { e.preventDefault(); return; }
    e.dataTransfer.setData('text/plain', chip.dataset.name);
    e.dataTransfer.setData('text/section', chip.dataset.sec);
    e.dataTransfer.effectAllowed = 'copy';
  });

  /* ── zoom / range / buffer ── */
  function zoomDays(z) { return z === 7 ? 7 : z * 30.4375; }
  function bufMonths() { return state.zoom === 7 ? 1 : 6; }
  function laneW() { return innerWidth < 760 ? 120 : 172; }
  var MINW = { 7: 30, 1: 8, 3: 5, 6: 1.6, 12: 1.2 };
  function refitDayW() {
    var avail = Math.max(tl.clientWidth - laneW(), 120);
    dayW = Math.max(avail / zoomDays(state.zoom) * state.scale, MINW[state.zoom]);
  }
  function dateAtLeft() { return bufStartT + Math.round(savedScroll / dayW) * MS; }
  function chartViewMs() { return (Math.max(tl.clientWidth - laneW(), 0) / dayW) * MS; }
  function visibleRange() { var a = dateAtLeft(); return [a, a + chartViewMs()]; }
  function deriveAnchor() {
    var t = Math.min(Math.max(dateAtLeft(), bufStartT), bufEndT - 1);
    var d = new Date(t);
    return { y: d.getUTCFullYear(), m: d.getUTCMonth() };
  }
  function rangeLabel() {
    var y = state.anchor.y, m = state.anchor.m, z = state.zoom;
    if (z === 7) {
      var a = new Date(Date.UTC(y, m, 1)), b = new Date(Date.UTC(y, m, 1) + 6 * MS);
      return a.getUTCDate() + ' – ' + b.getUTCDate() + ' ' + M_S[b.getUTCMonth()] + ' ' + b.getUTCFullYear();
    }
    if (z === 12) return String(y);
    var d2 = new Date(Date.UTC(y, m + z - 1, 1));
    if (z === 1) return M_L[m] + ' ' + y;
    if (d2.getUTCFullYear() === y) return M_S[m] + ' – ' + M_S[d2.getUTCMonth()] + ' ' + y;
    return M_S[m] + ' ' + y + ' – ' + M_S[d2.getUTCMonth()] + ' ' + d2.getUTCFullYear();
  }
  function renderToolbar() {
    var y = state.anchor.y, m = state.anchor.m, z = state.zoom;
    $('#rangeBtn').style.display = z === 12 ? 'none' : '';
    if (z === 7) {
      var t0 = Math.floor(dateAtLeft() / MS) * MS;
      var a = new Date(t0), b = new Date(t0 + 6 * MS);
      $('#rangeVal').textContent = a.getUTCMonth() === b.getUTCMonth()
        ? a.getUTCDate() + ' – ' + b.getUTCDate() + ' ' + M_S[b.getUTCMonth()]
        : a.getUTCDate() + ' ' + M_S[a.getUTCMonth()] + ' – ' + b.getUTCDate() + ' ' + M_S[b.getUTCMonth()];
      $('#yearVal').textContent = String(b.getUTCFullYear());
    } else {
      var e = new Date(Date.UTC(y, m + z - 1, 1));
      $('#rangeVal').textContent = z === 1 ? M_L[m] : M_S[m] + ' – ' + M_S[e.getUTCMonth()];
      $('#yearVal').textContent = e.getUTCFullYear() === y ? String(y) : y + ' – ' + e.getUTCFullYear();
    }
    var vr = visibleRange();
    var n = events.filter(function (ev) { return ev.end >= vr[0] && ev.start < vr[1]; }).length;
    $('#viewCount').textContent = n + ' event' + (n !== 1 ? 's' : '') + ' in view';
  }

  /* ── timeline ── */
  var ROWH = 34, BARH = ROWH - 12;
  function renderTimeline() {
    buildHotbar();
    var LANE_W = laneW();
    var totalDays = Math.round((bufEndT - bufStartT) / MS);
    var chartW = Math.round(totalDays * dayW);
    function xOf(t) { return (t - bufStartT) / MS * dayW; }

    var months = [];
    for (var t = bufStartT; t < bufEndT; t = monthAddT(t, 1)) {
      var d = new Date(t);
      months.push({ t: t, mi: d.getUTCMonth(), yr: d.getUTCFullYear(), days: Math.round((monthAddT(t, 1) - t) / MS) });
    }
    var showDays = dayW >= 16, showWD = dayW >= 24;
    var todayT = todayUTC();
    var todayX = Math.round(xOf(todayT) + dayW / 2 - 1);
    var todayFlagX = Math.round(xOf(todayT) + dayW / 2);

    var monthsHTML = '';
    if (!showDays) {
      months.forEach(function (mo, i) {
        var x = Math.round(xOf(mo.t)), w = Math.round(mo.days * dayW);
        var lb = w > 78 ? M_L[mo.mi] : M_S[mo.mi];
        if (i === 0 || mo.mi === 0) lb += ' ' + mo.yr;
        monthsHTML += '<div class="hmonth" style="left:' + x + 'px;width:' + w + 'px">' + lb + '</div>';
      });
      if (todayT >= bufStartT && todayT < bufEndT)
        monthsHTML += '<div class="hflag" style="left:' + todayFlagX + 'px">Today</div>';
    }

    var daysHTML = '';
    if (showDays) {
      var wd0 = new Date(bufStartT).getUTCDay();
      var firstCell = true;
      for (var di = 0; di < totalDays; di++) {
        var ts = bufStartT + di * MS, dd = new Date(ts);
        var wd = (wd0 + di) % 7, dn = dd.getUTCDate(), we = (wd === 0 || wd === 6) ? ' we' : '';
        var top;
        if (dn === 1) {
          var mi = dd.getUTCMonth(), yr = dd.getUTCFullYear();
          var wantYr = (mi === 0 || firstCell);
          var ml = wantYr && dayW >= 78 ? M_L[mi] + ' ' + yr
                 : wantYr && dayW >= 52 ? M_S[mi] + ' ' + yr
                 : (dayW >= 32 ? M_L[mi] : M_S[mi]);
          top = '<i class="mo">' + ml + '</i>';
        } else {
          top = showWD ? '<i>' + WD[wd] + '</i>' : '';
        }
        daysHTML += '<div class="hday' + we + '" style="left:' + Math.round(di * dayW) + 'px;width:' + Math.ceil(dayW) + 'px">' +
          top + '<b>' + dn + '</b></div>';
        firstCell = false;
      }
      if (todayT >= bufStartT && todayT < bufEndT)
        daysHTML += '<div class="hflag" style="left:' + todayFlagX + 'px">Today</div>';
    }
    var gridBg = dayW >= 7
      ? 'background-image:repeating-linear-gradient(90deg,var(--dayline) 0 1px,transparent 1px ' + dayW + 'px);' : '';

    var grid = '';
    months.forEach(function (mo) { grid += '<div class="gmonth" style="left:' + Math.round(xOf(mo.t)) + 'px"></div>'; });
    if (dayW >= 7) {
      var wd0b = new Date(bufStartT).getUTCDay();
      if (wd0b === 0) grid += '<div class="gwkd" style="left:0;width:' + dayW + 'px"></div>';
      var di2 = (6 - wd0b + 7) % 7;
      for (; di2 < totalDays; di2 += 7) grid += '<div class="gwkd" style="left:' + Math.round(di2 * dayW) + 'px;width:' + dayW * 2 + 'px"></div>';
    }
    if (todayT >= bufStartT && todayT < bufEndT)
      grid += '<div class="gtoday" style="left:' + todayX + 'px"></div>';

    var flOn = state.showFL;
    var half = dayW / 2;
    var sgap = Math.min(dayW / 2, 3);
    var minBar = Math.max(2, Math.min(dayW * 0.4, 10));
    var k = state.mode;
    var lanesHTML = '';
    groupsInOrder().forEach(function (g) {
      if (state.mode === 'sections' && state.hiddenSecs.indexOf(g.name) >= 0) return;
      /* seam marks for runs that touch (end == next start), per lane */
      g.evs.forEach(function (ev) { ev.seamL = false; ev.seamR = false; });
      var byLane = {};
      g.evs.forEach(function (ev) {
        var r = ev.rw[k] == null ? 0 : ev.rw[k];
        (byLane[r] = byLane[r] || []).push(ev);
      });
      Object.keys(byLane).forEach(function (r) {
        var arr = byLane[r].slice().sort(function (a, b) { return a.start - b.start || a.id - b.id; });
        for (var i = 0; i + 1 < arr.length; i++) {
          if (arr[i].end === arr[i + 1].start) { arr[i].seamR = true; arr[i + 1].seamL = true; }
        }
      });
      var lanes = laneList(g);
      var nRows = Math.max(lanes.length, 1);
      var rowIdx = {}; lanes.forEach(function (r, i) { rowIdx[r] = i; });
      var barsHTML = '';
      g.evs.forEach(function (ev) {
        /* noon-to-noon bars: from the middle of the start day to the middle of the end day */
        var x1 = xOf(ev.start) + half + (ev.seamL ? sgap / 2 : 0);
        var x2 = xOf(ev.end) + half - (ev.seamR ? sgap / 2 : 0);
        if (x2 < 0 || x1 > chartW) return;
        if (x2 - x1 < minBar && !ev.seamL) x1 = x2 - minBar;
        var w = Math.max(x2 - x1, 1.5);
        var right = x1 + w;
        var vi = rowIdx[ev.rw[k]] != null ? rowIdx[ev.rw[k]] : 0;
        var top = vi * ROWH + (ROWH - BARH) / 2;
        var col = barColor(ev);
        var isFl = flOn && ev.fl;
        var editable = canEdit(ev);

        var inLbl = '', outLbl = '';
        if (w >= 40) {
          inLbl = '<span class="bl" style="color:' + textColorFor(col) + '">' + iconHTML(ev.name) + esc(ev.name) + '</span>';
        } else {
          var room = chartW - right - 8;
          if (room >= 34) {
            outLbl = '<span class="blo' + (flOn && !isFl ? ' dim' : '') + '" style="left:' + (right + 5) + 'px;top:' + top + 'px;height:' + BARH + 'px;max-width:' + Math.min(room, 170) + 'px">' + iconHTML(ev.name) + esc(ev.name) + '</span>';
          }
        }
        var badge = isFl && w >= 26 ? '<i class="flb">FL</i>' : '';
        var hnds = editable ? '<span class="hnd hL" title="Drag to change the start date"></span><span class="hnd hR" title="Drag to change the end date"></span>' : '';
        var title = ev.scenario ? esc(ev.name) : esc(ev.name) + ' — base event' + (state.lockPast ? ' (locked; click to view)' : '');
        barsHTML += '<div class="bar' + (!ev.scenario ? ' base' : '') + (isFl ? ' is-fl' : '') + (ev.id === selId ? ' sel' : '') +
          '" data-id="' + ev.id + '" title="' + title +
          '" style="left:' + x1 + 'px;width:' + w + 'px;top:' + top + 'px;height:' + BARH + 'px;background:' + col + '">' +
          inLbl + badge + hnds + '</div>' + outLbl;
      });
      lanesHTML += '<div class="lane">' +
        '<div class="lane-label" style="width:' + LANE_W + 'px">' +
          '<span class="dot" style="background:' + (state.mode === 'creative' ? 'var(--accent)' : sectionColor(g.name)) + '"></span>' +
          '<span class="ltxt"><b>' + esc(g.name) + '</b></span>' +
          '<span class="lcount">' + g.evs.length + '</span>' +
        '</div>' +
        '<div class="lane-chart" data-sec="' + esc(g.name) + '" style="width:' + chartW + 'px;height:' + nRows * ROWH + 'px">' + barsHTML + '</div>' +
      '</div>';
    });

    tl.innerHTML = '<div class="tl-inner" style="width:' + (LANE_W + chartW) + 'px">' +
      '<div class="tl-head">' +
        '<div class="tl-corner" style="width:' + LANE_W + 'px">' +
          '<span>sections</span>' +
          (state.mode === 'sections'
            ? '<button id="secTri" class="sectri" title="Show or hide section lanes (display only)" aria-label="Show or hide section lanes">' +
              '<svg width="9" height="7" viewBox="0 0 10 8"><path d="M0 .5h10L5 7.5z" fill="currentColor"/></svg></button>'
            : '') +
        '</div>' +
        '<div class="tl-headcol" style="width:' + chartW + 'px;' + gridBg + '">' +
          (showDays ? '<div class="hd-row">' + daysHTML + '</div>' : '<div class="hm-row">' + monthsHTML + '</div>') +
        '</div>' +
      '</div>' +
      '<div class="tl-lanewrap">' +
        '<div class="tl-grid" style="left:' + LANE_W + 'px;width:' + chartW + 'px;' + gridBg + '">' + grid + '</div>' +
        lanesHTML +
      '</div>' +
    '</div>';
    tl.classList.toggle('fl-on', flOn);
    tl.scrollLeft = savedScroll;
  }

  function updateEmptyOverlay() {
    var el = $('#tlEmpty');
    if (!dataLoaded) { el.hidden = false; el.innerHTML = '<p>loading…</p>'; return; }
    var vr = visibleRange();
    var any = events.some(function (ev) {
      return ev.end >= vr[0] && ev.start < vr[1] &&
        (state.mode !== 'sections' || state.hiddenSecs.indexOf(ev.section) < 0);
    });
    el.hidden = any;
    if (!any) {
      el.innerHTML = events.length
        ? '<p>Nothing on the calendar here — keep scrolling.</p>'
        : '<p>Nothing here yet — drag a chip from above onto a lane, drag across a lane to draw an event, or import a scenario file.</p>';
    }
  }

  /* ── buffer management ── */
  function handleScrollFrame() {
    savedScroll = tl.scrollLeft;
    var rightGap = tl.scrollWidth - tl.clientWidth - savedScroll;
    var trigger = (state.zoom === 7 ? 1 : 2) * 30.4375 * dayW;
    if (rightGap < trigger) { bufEndT = monthAddT(bufEndT, bufMonths()); renderTimeline(); }
    else if (savedScroll < trigger) {
      var old = bufStartT; bufStartT = monthAddT(bufStartT, -bufMonths());
      savedScroll += (old - bufStartT) / MS * dayW; renderTimeline();
    }
    var viewL = dateAtLeft(), viewR = viewL + chartViewMs();
    var BM = bufMonths(), KEEP = 3 * BM * 30.4375 * MS, STEP = BM * 30.4375 * MS;
    var ns = bufStartT, ne = bufEndT;
    while (viewL - ns > KEEP + STEP) ns = monthAddT(ns, BM);
    while (ne - viewR > KEEP + STEP) ne = monthAddT(ne, -BM);
    if (ns !== bufStartT || ne !== bufEndT) {
      savedScroll -= (ns - bufStartT) / MS * dayW;
      bufStartT = ns; bufEndT = ne; renderTimeline();
    }
    var a = deriveAnchor();
    if (a.y !== state.anchor.y || a.m !== state.anchor.m) state.anchor = a;
    renderToolbar(); updateEmptyOverlay(); positionEditor();
  }
  function ensureBufferCover(lo, hi) {
    var marginMs = (state.zoom === 7 ? 1 : 2.5) * 30.4375 * MS;
    var delta = 0, changed = false;
    while (bufStartT > lo - marginMs) { var old = bufStartT; bufStartT = monthAddT(bufStartT, -bufMonths()); delta += (old - bufStartT) / MS * dayW; changed = true; }
    while (bufEndT < hi + marginMs) { bufEndT = monthAddT(bufEndT, bufMonths()); changed = true; }
    if (changed) { savedScroll += delta; renderTimeline(); }
  }
  function goToDate(t, center) {
    var viewMs = Math.max(chartViewMs(), zoomDays(7) * dayW * MS);
    ensureBufferCover(center ? t - viewMs / 2 : t, center ? t + viewMs / 2 : t + viewMs);
    var halfPx = center ? Math.max(tl.clientWidth - laneW(), 0) / 2 : 0;
    var x = Math.max(0, (t - bufStartT) / MS * dayW - halfPx);
    savedScroll = x;
    tl.scrollLeft = x;
    renderToolbar(); updateEmptyOverlay();
  }
  function step(dir) {
    goToDate(Date.UTC(state.anchor.y, state.anchor.m + dir * state.zoom, 1));
  }

  /* ── selection & panes ── */
  function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }
  function select(ev, readOnly) {
    selId = ev ? ev.id : null;
    tl.querySelectorAll('.bar.sel').forEach(function (b) { b.classList.remove('sel'); });
    if (ev) {
      var bar = tl.querySelector('.bar[data-id="' + ev.id + '"]');
      if (bar) bar.classList.add('sel');
      if (readOnly && !canEdit(ev)) openInfo(ev);
      else openEditor(ev);
    } else {
      edWrap.style.display = 'none';
    }
  }
  function openInfo(ev) {
    var col = barColor(ev);
    var days = Math.round((ev.end - ev.start) / MS) + 1;
    var ls = lookupLinks(ev);
    var html = '<div class="ed" style="border-color:' + col + '">' +
      '<b class="iname">' + esc(ev.name) + '</b>' +
      '<span class="ir">' + esc(ev.section) + '</span>' +
      '<span class="ir mono">' + esc(fmtRange(ev)) + ' · ' + days + (days > 1 ? ' days' : ' day') + '</span>' +
      (ev.fl ? '<span class="ifl">COUNTS FOR FL</span>' : '');
    if (ls.length) {
      html += '<div class="tlinks">';
      ls.forEach(function (l) {
        var st = l.color ? ' style="color:' + esc(l.color) + '"' : '';
        var chip = l.color ? ' style="background:' + esc(l.color) + '"' : '';
        html += '<a class="tlink" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer"' + st + '>' +
          '<i' + chip + '></i><span>' + esc(l.text) + '</span></a>';
      });
      html += '</div>';
    }
    html += '<span class="ir dim">Base event from the repo file — turn off “Lock past” to edit it.</span></div>';
    edWrap.innerHTML = html;
    edWrap.style.display = 'block';
    positionEditor();
  }
  function openEditor(ev) {
    var secSel = '';
    if (state.mode === 'sections') {
      secSel = '<label>section<select id="edSec">' +
        sectionNames().map(function (n) {
          return '<option' + (n === ev.section ? ' selected' : '') + '>' + esc(n) + '</option>';
        }).join('') + '</select></label>';
    }
    var cur = ev.color;
    var sw = palette().map(function (c, i) {
      var on = cur && cur === c;
      return '<button class="swb' + (on ? ' on' : '') + '" data-c="' + c + '" style="background:' + c + '" title="palette colour ' + (i + 1) + '"></button>';
    }).join('');
    edWrap.innerHTML = '<div class="ed" style="border-color:' + barColor(ev) + '">' +
      '<label>name<input type="text" id="edName" value="' + escAttr(ev.name) + '" maxlength="80"></label>' +
      secSel +
      '<div class="eddates">' +
        '<label>from<input type="date" id="edFrom" value="' + isoOf(ev.start) + '"></label>' +
        '<label>to<input type="date" id="edTo" value="' + isoOf(ev.end) + '"></label>' +
      '</div>' +
      '<span class="eddays" id="edDays"></span>' +
      '<label class="edrow"><input type="checkbox" id="edFl"' + (ev.fl ? ' checked' : '') + '> Counts for Farmer&#39;s League</label>' +
      '<div><div class="swrow">' + sw + '</div>' +
        '<div class="custom-row" style="margin-top:8px">' +
          '<input type="color" id="edPick" value="' + (cur || '#C25B3C') + '" title="Custom colour">' +
          '<span class="lbl">custom</span>' +
          '<button class="edbtn" id="edAuto" style="margin-left:auto">auto colour</button>' +
        '</div></div>' +
      '<div class="edacts">' +
        '<span class="eddays">' + (!ev.scenario ? 'base event — ' : '') + (state.lockPast && !ev.scenario ? 'locked' : 'editing') + '</span>' +
        '<button class="edbtn" id="edDel" style="margin-left:auto">delete</button>' +
      '</div>' +
    '</div>';
    edWrap.style.display = 'block';
    updateEdDays(ev);

    $('#edName').addEventListener('input', function () {
      ev.name = this.value || 'Untitled';
      markEdited(ev); saveAll();
      var bar = tl.querySelector('.bar[data-id="' + ev.id + '"] .bl');
      if (bar) bar.innerHTML = iconHTML(ev.name) + esc(ev.name);
      buildHotbar();
    });
    if ($('#edSec')) $('#edSec').addEventListener('change', function () {
      ev.section = this.value;
      ev.rw.sections = null;
      markEdited(ev); ensureRows(); saveAll(); renderTimeline(); openEditor(ev);
    });
    $('#edFrom').addEventListener('change', function () {
      var t = parseISO(this.value); if (t == null) return;
      ev.start = Math.min(t, ev.end);
      markEdited(ev); saveAll(); renderTimeline(); openEditor(ev);
    });
    $('#edTo').addEventListener('change', function () {
      var t = parseISO(this.value); if (t == null) return;
      ev.end = Math.max(t, ev.start);
      markEdited(ev); saveAll(); renderTimeline(); openEditor(ev);
    });
    $('#edFl').addEventListener('change', function () {
      ev.fl = this.checked; markEdited(ev); saveAll(); renderTimeline(); positionEditor();
    });
    edWrap.querySelectorAll('.swb').forEach(function (b) {
      b.addEventListener('click', function () {
        ev.color = b.dataset.c; markEdited(ev); saveAll();
        recolorBar(ev); openEditor(ev);
      });
    });
    $('#edPick').addEventListener('input', function () {
      ev.color = this.value; markEdited(ev); saveAll(); recolorBar(ev);
    });
    $('#edAuto').addEventListener('click', function () {
      ev.color = null; markEdited(ev); saveAll(); recolorBar(ev); openEditor(ev);
    });
    $('#edDel').addEventListener('click', function () { deleteEvent(ev); });

    positionEditor();
  }
  function updateEdDays(ev) {
    var el = $('#edDays');
    if (el) el.textContent = Math.round((ev.end - ev.start) / MS) + 1 + ' day' + (ev.end === ev.start ? '' : 's');
  }
  function recolorBar(ev) {
    var bar = tl.querySelector('.bar[data-id="' + ev.id + '"]');
    if (!bar) return;
    var col = barColor(ev);
    bar.style.background = col;

  /* ── scenario import / export / clear ── */
  function importScenarioText(text) {

    var stripped = text.replace(/^\uFEFF/, '');
    var obj = null;
    try { obj = JSON.parse(stripped); } catch (e) {}
    var raw = null;
    if (obj && typeof obj === 'object') raw = Array.isArray(obj) ? obj : (Array.isArray(obj.events) ? obj.events : null);
    if (!raw) {
      stripped.split(/\r?\n/).forEach(function (ln) {

        try { var o = JSON.parse(s); if (o && typeof o === 'object') list.push(o); } catch (e2) {}

    } else list = raw;
    var clean = list.map(sanitizeScenario).filter(Boolean);
    if (!clean.length) { setStat('No usable events found in that file.', true); return; }
    if (!confirm('Replace the current scenario with the ' + clean.length + ' event' + (clean.length !== 1 ? 's' : '') + ' from this file?\n(Base data from the repo is not affected.)')) return;
    events = events.filter(function (e) { return !e.scenario; });
    clean.forEach(function (ev) { events.push(ev); });
    select(null);

  $('#zIn').addEventListener('click', function () { setScale(1.2); });
  $('#zOut').addEventListener('click', function () { setScale(1 / 1.2); });

  $('#addBtn').addEventListener('click', function () {
    var vr = visibleRange();
    var start = Math.max(todayUTC(), vr[0] + Math.floor(chartViewMs() / 4 / MS) * MS);
    var secName = state.mode === 'creative'
      ? 'Events'
      : (sectionNames().find(function (s) { return state.hiddenSecs.indexOf(s) < 0; }) || 'Unsorted');
    var ev = mkEvent('New event', start, start + 6 * MS, secName, false, null, { sections: null, creative: null }, true);
    events.push(ev);
    ensureRows();
    ev.rw[state.mode] = freeRowFrom(groupOf2(ev), ev, 0);
    ensureRows(); saveAll(); renderTimeline();
    goToDate(ev.start, false);
    select(ev);
  });

  tl.addEventListener('scroll', function () {
    if (scrollRaf) return;
    scrollRaf = requestAnimationFrame(function () { scrollRaf = 0; handleScrollFrame(); });
  }, { passive: true });
  tl.addEventListener('click', function (e) {
    if (e.target.closest('#secTri')) { openCornerPop(); return; }
  });

  /* ── pane height resize ── */
  function applyVHeight() {
    tl.style.height = state.vHeight ? state.vHeight + 'px' : '';
  }
  var vResize = $('#vResize'), vhDrag = null;
  var EDGE_ZONE = 70, EDGE_SPEED = 16, vEdgeRaf = 0;
  function dragHeight() {
    return Math.max(240, Math.min(2200, vhDrag.h + (vhDrag.lastY - vhDrag.y) + vhDrag.sc));
  }
  function vEdgeScroll() {
    if (!vhDrag) { vEdgeRaf = 0; return; }
    var y = vhDrag.lastY, v = 0;
    if (y > innerHeight - EDGE_ZONE) v = 2 + (EDGE_SPEED - 2) * Math.min(1, (y - (innerHeight - EDGE_ZONE)) / EDGE_ZONE);
    else if (y < EDGE_ZONE) v = -(2 + (EDGE_SPEED - 2) * Math.min(1, (EDGE_ZONE - y) / EDGE_ZONE));
    if (v) { window.scrollBy(0, v); vhDrag.sc += v; state.vHeight = dragHeight(); applyVHeight(); }
    vEdgeRaf = requestAnimationFrame(vEdgeScroll);
  }
  vResize.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try { window.getSelection().removeAllRanges(); } catch (err) {}
    vResize.setPointerCapture(e.pointerId);
    vResize.classList.add('drag');
    vhDrag = { y: e.clientY, h: tl.offsetHeight, lastY: e.clientY, sc: 0 };
    if (!vEdgeRaf) vEdgeRaf = requestAnimationFrame(vEdgeScroll);
  });
  vResize.addEventListener('pointermove', function (e) {
    if (!vhDrag) return;
    vhDrag.lastY = e.clientY;
    state.vHeight = dragHeight();
    applyVHeight();
  });
  function vResizeEnd() {
    if (!vhDrag) return;
    vhDrag = null;
    if (vEdgeRaf) { cancelAnimationFrame(vEdgeRaf); vEdgeRaf = 0; }
    vResize.classList.remove('drag');
    saveAll();
  }
  vResize.addEventListener('pointerup', vResizeEnd);
  vResize.addEventListener('pointercancel', vResizeEnd);
  vResize.addEventListener('dblclick', function () {
    state.vHeight = null; applyVHeight(); saveAll();
  });

  new ResizeObserver(function () {
    cancelAnimationFrame(roTimer);
    roTimer = requestAnimationFrame(function () {
      var w = tl.clientWidth;
      if (Math.abs(w - lastW) <= 8) return;
      lastW = w;
      var center = dateAtLeft() + chartViewMs() / 2;
      refitDayW();
      savedScroll = Math.max(0, (center - bufStartT) / MS * dayW - Math.max(tl.clientWidth - laneW(), 0) / 2);
      renderTimeline(); renderToolbar(); updateEmptyOverlay(); positionEditor();
    });
  }).observe(tl);

  /* ── init ── */
  loadScenario();
  applyTheme();
  $('#flBtn').classList.toggle('on', state.showFL);
  $('#flBtn').setAttribute('aria-pressed', state.showFL);
  $('#lockBtn').classList.toggle('on', state.lockPast);
  $('#lockBtn').setAttribute('aria-pressed', state.lockPast);
  document.querySelectorAll('#modeSeg button').forEach(function (b) { b.classList.toggle('on', b.dataset.mode === state.mode); });
  document.querySelectorAll('#zoomSeg button').forEach(function (b) { b.classList.toggle('on', +b.dataset.z === state.zoom); });
  updateScaleUI();
  refitDayW();
  var initAT = Date.UTC(state.anchor.y, state.anchor.m, 1);
  bufStartT = monthAddT(initAT, -bufMonths());
  bufEndT = monthAddT(initAT, bufMonths() + Math.ceil(zoomDays(state.zoom) / 30.4375));
  savedScroll = (initAT - bufStartT) / MS * dayW;
  lastW = tl.clientWidth;
  applyVHeight();
  ensureRows();
  renderTimeline();
  renderToolbar();
  updateEmptyOverlay();
  loadData().then(function () {
    ensureRows();
    probeIcons();
    buildHotbar(true);
    renderTimeline(); updateEmptyOverlay();
  });
  fetchLinks();
})();
</script>
</body>
</html>
